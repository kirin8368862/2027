<style>

  :root { --fs: 24px; --bg:#ffffff; --text:#000000; --sub:#333333; --accent:#1d4ed8; --hl:#ffe066; --line:#9ca3af; --soft:#eef3ff; }
  :root.big { --fs: 30px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:var(--fs); line-height:1.4;
         font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  header { position:sticky; top:0; background:var(--bg); padding:14px 16px 12px; border-bottom:3px solid var(--accent); z-index:1; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  h1 { margin:0; font-size:22px; white-space:nowrap; }
  #size { font-size:20px; padding:6px 12px; border:3px solid var(--accent); border-radius:12px; background:#fff; color:var(--accent); font-weight:700; white-space:nowrap; }
  label { display:block; font-weight:700; margin-bottom:6px; }
  .bar { display:flex; gap:8px; }
  input { flex:1; min-width:0; font-size:1.25em; font-weight:700; padding:12px 14px; height:2.4em;
          border:4px solid var(--accent); border-radius:14px; background:#fff; color:var(--text); }
  input::placeholder { color:#777; font-weight:400; font-size:0.8em; }
  input:focus { outline:4px solid var(--hl); }
  #go { font-size:0.95em; padding:0 14px; border:0; border-radius:14px; background:#15803d; color:#fff; font-weight:800; white-space:nowrap; }
  body.typing #mic { display:none; }   /* 打字時隱藏語音鍵，讓結果多一點空間 */
  #again { display:block; width:100%; margin-top:16px; height:2.4em; font-size:1em; font-weight:700; border:3px solid var(--accent); border-radius:14px; background:#fff; color:var(--accent); }
  #mic { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:10px; height:2.4em;
         font-size:1em; font-weight:700; border:0; border-radius:14px; background:var(--accent); color:#fff; }
  #mic.on { background:#dc2626; }
  main { padding:14px 16px 40px; }
  .help { background:var(--soft); border-radius:14px; padding:14px 16px; }
  .help p { margin:0 0 10px; } .help p:last-child { margin:0; }
  .msg { font-weight:700; margin:4px 0 12px; }
  .msg.none { color:#b91c1c; }
  .card { border:3px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .card.best { border-color:var(--accent); background:var(--soft); }
  .name { font-size:1.4em; font-weight:800; letter-spacing:2px; }
  .code { color:var(--sub); font-size:0.85em; }
  .page { margin-top:6px; font-size:1em; font-weight:700; }
  .page b { font-size:2.2em; color:var(--accent); line-height:1; margin:0 6px; }
  mark { background:var(--hl); color:inherit; border-radius:4px; padding:0 2px; }
  .near { font-weight:700; margin:20px 0 10px; }
  .more { color:var(--sub); }
</style>
</head>

<header>

</header>

</template>

    [...name].forEach((c, i) => {
      if (han.includes(c)) { pts += 2; marks.add(i); }
      else if ([...han].some(h => sameSound(h, c))) { pts += 1.5; marks.add(i); }
    });
    const ratio = pts / (2 * name.length);
    if (ratio >= 0.6) near.push([ratio, r, marks]);
  }
  hits.sort((a, b) => b[0] - a[0] || a[1][2][0] - b[1][2][0]);
  near.sort((a, b) => b[0] - a[0]);
  return { hits, near: near.slice(0, 8) };
}

const el = (tag, cls, text) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, text != null ? { textContent: text } : {});

function card([code, name, pages], mark, codeHit, best) {
  const c = el('div', 'card' + (best ? ' best' : ''));
  const n = el('div', 'name');
  const at = typeof mark === 'string' && mark ? name.indexOf(mark) : -1;
  [...name].forEach((ch, i) => {
    const hl = mark instanceof Set ? mark.has(i) : (at >= 0 && i >= at && i < at + mark.length);
    n.append(hl ? el('mark', '', ch) : ch);
  });
  const cd = el('div', 'code', '編號 ');
  cd.append(codeHit ? el('mark', '', code) : code);
  const p = el('div', 'page', '在');
  p.append(el('b', '', '第 ' + pages.join('、') + ' 頁'));
  c.append(n, p, cd);
  return c;
}

const out = document.getElementById('out'), q = document.getElementById('q'), go = document.getElementById('go');
function render() {
  out.replaceChildren();
  if (!q.value.trim()) { out.append(document.getElementById('help').content.cloneNode(true)); return; }
  const { hits, near } = search(q.value);
  if (hits.length) {
    out.append(el('div', 'msg', hits.length === 1 ? '找到了！' : `找到 ${hits.length} 位，請找您的名字：`));
    hits.slice(0, 30).forEach(([, r, m, ch]) => out.append(card(r, m, ch, hits.length === 1)));
    if (hits.length > 30) out.append(el('div', 'more', `還有 ${hits.length - 30} 位，請多打幾個字`));
  } else {
    out.append(el('div', 'msg none', near.length ? '沒有完全一樣的名字' : '查不到這個名字，請再確認一次'));
  }
  if (near.length && hits.length < 3) {
    out.append(el('div', 'near', '您要找的是不是：'));
    near.forEach(([, r, m]) => out.append(card(r, m)));
  }
  const again = el('button', '', '↺ 查別的名字');
  again.id = 'again'; again.type = 'button';
  again.onclick = () => { q.value = ''; render(); window.scrollTo(0, 0); q.focus(); };
  out.append(again);
}
q.addEventListener('input', render);
// 按「搜尋」或鍵盤的搜尋鍵：收起鍵盤，讓結果整個看得到
const done = () => { q.blur(); render(); window.scrollTo(0, 0); if (!q.value.trim()) q.focus(); };
q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(); } });
go.onclick = done;
q.addEventListener('focus', () => document.body.classList.add('typing'));
q.addEventListener('blur', () => document.body.classList.remove('typing'));

// 字放大（記住設定）
const size = document.getElementById('size');
const setBig = on => { document.documentElement.classList.toggle('big', on); size.textContent = on ? '字變小' : '字放大'; try { localStorage.big = on ? '1' : ''; } catch {} };
try { setBig(!!localStorage.big); } catch { setBig(false); }
size.onclick = () => setBig(!document.documentElement.classList.contains('big'));

// 瀏覽器內建語音辨識（有支援才顯示；沒網路時改用鍵盤上的麥克風）
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById('mic');
if (SR) {
  mic.hidden = false;
  let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'zh-TW'; rec.interimResults = true;
    rec.onresult = e => { q.value = [...e.results].map(x => x[0].transcript).join(''); render(); };
    rec.onerror = e => { out.replaceChildren(el('div', 'msg none', e.error === 'network' ? '現在沒有網路，請改按手機鍵盤上的 🎤 麥克風說名字' : '沒聽清楚，請再按一次，或改用打字')); };
    rec.onend = () => { rec = null; mic.classList.remove('on'); mic.textContent = '🎤 按這裡用說的'; };
    mic.classList.add('on'); mic.textContent = '🔴 請說名字…（說完再按一下）'; rec.start();
  };
}

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
